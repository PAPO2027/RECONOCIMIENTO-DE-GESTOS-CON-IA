name: Verify Vite build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d5f7c3d3f15f7c1d4d0f9e6e0a
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
